<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Админка — посты</title>
<style>
  :root{
    --bg:#1B1B1B; --card:#262626; --accent:#F2CC00; --text:#ececec; --muted:#a9abb3; --danger:#ff6b6b; --ok:#6bd68a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,Arial,sans-serif;padding:20px 16px 60px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:560px}
  h1{color:var(--accent);font-size:26px;margin-bottom:16px}
  h2{color:var(--accent);font-size:18px;margin-bottom:12px}
  .box{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid #3a3a3a;border-radius:10px;padding:11px 12px;font:inherit;font-size:15px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:140px;resize:vertical;line-height:1.5}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button{font:inherit;font-weight:600;font-size:15px;border:none;border-radius:12px;padding:13px 16px;cursor:pointer}
  .btn-main{background:var(--accent);color:#1B1B1B;width:100%;margin-top:16px}
  .btn-sec{background:#3a3a3a;color:var(--text)}
  .btn-del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  button:disabled{opacity:.5;cursor:default}
  #status{font-size:14px;margin-top:12px;min-height:20px}
  .ok{color:var(--ok)} .err{color:var(--danger)}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
  .item{border-top:1px solid #3a3a3a;padding:12px 0;display:flex;gap:10px;align-items:center}
  .item:first-child{border-top:none}
  .item .info{flex:1;min-width:0}
  .item .d{font-size:12px;color:var(--muted)}
  .item .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item button{padding:8px 12px;font-size:13px}
  #preview{max-width:100%;border-radius:10px;margin-top:10px;display:none}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Админка постов</h1>

  <!-- ПОДКЛЮЧЕНИЕ -->
  <div class="box" id="settingsBox">
    <h2>Подключение к GitHub</h2>
    <label>Владелец (логин или организация)</label>
    <input id="owner" placeholder="xarnakcom">
    <label>Репозиторий</label>
    <input id="repo" placeholder="название репозитория сайта">
    <div class="row">
      <div><label>Ветка</label><input id="branch" value="main"></div>
      <div><label>Файл с постами</label><input id="file" value="posts.json"></div>
    </div>
    <label>Токен (fine-grained, Contents: Read and write)</label>
    <input id="token" type="password" placeholder="github_pat_...">
    <p class="hint">Токен хранится только в этом браузере (localStorage) и отправляется только на api.github.com. На чужом устройстве после работы нажми «Выйти».</p>
    <div class="row" style="margin-top:14px">
      <button class="btn-main" style="margin-top:0" id="connectBtn">Подключиться</button>
      <button class="btn-sec" id="logoutBtn">Выйти</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <!-- ФОРМА -->
    <div class="box">
      <h2 id="formTitle">Новый пост</h2>
      <div class="row">
        <div><label>Дата</label><input id="date" type="date"></div>
      </div>
      <label>Заголовок</label>
      <input id="title">
      <label>Текст (переносы строк сохраняются)</label>
      <textarea id="text"></textarea>
      <label>Картинка (необязательно)</label>
      <input id="imageFile" type="file" accept="image/*">
      <input id="imagePath" class="hidden" >
      <img id="preview" alt="">
      <div class="row">
        <div><label>Ссылка (необязательно)</label><input id="link" placeholder="https://"></div>
        <div><label>Текст кнопки</label><input id="linkText" placeholder="Подробнее"></div>
      </div>
      <button class="btn-main" id="saveBtn">Опубликовать</button>
      <button class="btn-sec hidden" id="cancelBtn" style="width:100%;margin-top:10px">Отменить редактирование</button>
      <div id="status"></div>
    </div>

    <!-- СПИСОК -->
    <div class="box">
      <h2>Все посты</h2>
      <div id="list"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var posts = [], fileSha = null, editIndex = -1, busy = false;

  /* ---------- настройки ---------- */
  function loadCfg(){
    try{
      var c = JSON.parse(localStorage.getItem('adminCfg') || '{}');
      ['owner','repo','branch','file','token'].forEach(function(k){ if(c[k]) $(k).value = c[k]; });
    }catch(e){}
  }
  function cfg(){
    return {
      owner:$('owner').value.trim(), repo:$('repo').value.trim(),
      branch:$('branch').value.trim()||'main', file:$('file').value.trim()||'posts.json',
      token:$('token').value.trim()
    };
  }
  function saveCfg(){ try{ localStorage.setItem('adminCfg', JSON.stringify(cfg())); }catch(e){} }

  /* ---------- утилиты ---------- */
  function status(msg, cls){ var s=$('status'); s.textContent = msg||''; s.className = cls||''; }
  function toB64(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    bytes.forEach(function(b){ bin += String.fromCharCode(b); });
    return btoa(bin);
  }
  function fromB64(b64){
    var bin = atob(b64.replace(/\n/g,'')), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function api(path, opts){
    var c = cfg();
    opts = opts || {};
    opts.headers = Object.assign({
      'Authorization':'Bearer '+c.token,
      'Accept':'application/vnd.github+json'
    }, opts.headers||{});
    return fetch('https://api.github.com/repos/'+c.owner+'/'+c.repo+path, opts).then(function(r){
      return r.json().then(function(j){
        if(!r.ok){ var e = new Error(j.message || ('HTTP '+r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }
  function today(){
    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  }

  /* ---------- загрузка/сохранение posts.json ---------- */
  function loadPosts(){
    var c = cfg();
    return api('/contents/'+encodeURIComponent(c.file)+'?ref='+encodeURIComponent(c.branch)+'&t='+Date.now())
      .then(function(j){
        fileSha = j.sha;
        posts = JSON.parse(fromB64(j.content));
        if(!Array.isArray(posts)) posts = [];
      })
      .catch(function(e){
        if(e.status === 404){ posts = []; fileSha = null; return; } // файла ещё нет — создадим
        throw e;
      });
  }
  function commitPosts(message){
    var c = cfg();
    var body = {
      message: message,
      content: toB64(JSON.stringify(posts, null, 2) + '\n'),
      branch: c.branch
    };
    if(fileSha) body.sha = fileSha;
    return api('/contents/'+encodeURIComponent(c.file), {
      method:'PUT', body: JSON.stringify(body)
    }).then(function(j){ fileSha = j.content.sha; });
  }

  /* ---------- картинки ---------- */
  function resizeImage(file){
    return new Promise(function(resolve, reject){
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function(){
        var max = 1600, w = img.width, h = img.height;
        if(w > max || h > max){ var k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){
          if(!b) return reject(new Error('Не удалось обработать картинку'));
          var fr = new FileReader();
          fr.onload = function(){ resolve(fr.result.split(',')[1]); };
          fr.readAsDataURL(b);
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function(){ reject(new Error('Не удалось прочитать картинку')); };
      img.src = url;
    });
  }
  function uploadImage(file){
    var c = cfg();
    var name = 'post-' + Date.now() + '.jpg';
    var path = 'img/' + name;
    return resizeImage(file).then(function(b64){
      return api('/contents/'+path, {
        method:'PUT',
        body: JSON.stringify({ message:'Add image '+name, content:b64, branch:c.branch })
      });
    }).then(function(){ return path; });
  }

  /* ---------- UI ---------- */
  function renderList(){
    var box = $('list'); box.innerHTML = '';
    if(!posts.length){ box.innerHTML = '<p class="hint">Постов пока нет.</p>'; return; }
    posts.forEach(function(p, i){
      var row = document.createElement('div'); row.className = 'item';
      var info = document.createElement('div'); info.className = 'info';
      var d = document.createElement('div'); d.className = 'd'; d.textContent = p.date || '';
      var t = document.createElement('div'); t.className = 't'; t.textContent = p.title || (p.text||'').slice(0,40) || '(без названия)';
      info.appendChild(d); info.appendChild(t);
      var e = document.createElement('button'); e.className = 'btn-sec'; e.textContent = 'Править';
      e.onclick = function(){ startEdit(i); };
      var x = document.createElement('button'); x.className = 'btn-del'; x.textContent = 'Удалить';
      x.onclick = function(){ removePost(i); };
      row.appendChild(info); row.appendChild(e); row.appendChild(x);
      box.appendChild(row);
    });
  }
  function resetForm(){
    editIndex = -1;
    $('formTitle').textContent = 'Новый пост';
    $('saveBtn').textContent = 'Опубликовать';
    $('cancelBtn').classList.add('hidden');
    $('date').value = today();
    ['title','text','link','linkText','imagePath'].forEach(function(k){ $(k).value = ''; });
    $('imageFile').value = '';
    $('preview').style.display = 'none';
  }
  function startEdit(i){
    var p = posts[i]; editIndex = i;
    $('formTitle').textContent = 'Редактирование';
    $('saveBtn').textContent = 'Сохранить изменения';
    $('cancelBtn').classList.remove('hidden');
    $('date').value = p.date || today();
    $('title').value = p.title || '';
    $('text').value = p.text || '';
    $('link').value = p.link || '';
    $('linkText').value = p.linkText || '';
    $('imagePath').value = p.image || '';
    $('imageFile').value = '';
    if(p.image){ $('preview').src = p.image; $('preview').style.display = 'block'; }
    else $('preview').style.display = 'none';
    status('');
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function setBusy(v){
    busy = v;
    ['saveBtn','connectBtn'].forEach(function(id){ $(id).disabled = v; });
  }

  function savePost(){
    if(busy) return;
    var title = $('title').value.trim(), text = $('text').value.trim();
    if(!title && !text){ status('Заполни заголовок или текст', 'err'); return; }
    setBusy(true); status('Публикую…');

    var file = $('imageFile').files[0];
    var imgStep = file ? uploadImage(file) : Promise.resolve($('imagePath').value.trim());

    imgStep.then(function(imagePath){
      var post = {
        date: $('date').value || today(),
        title: title, text: text,
        image: imagePath || '',
        link: $('link').value.trim(),
        linkText: $('linkText').value.trim()
      };
      var isEdit = editIndex >= 0;
      if(isEdit) posts[editIndex] = post; else posts.unshift(post);
      return commitPosts((isEdit ? 'Edit post: ' : 'Add post: ') + (title || post.date));
    }).then(function(){
      renderList(); resetForm();
      status('Готово! Сайт обновится через 1–2 минуты.', 'ok');
    }).catch(function(e){
      status('Ошибка: ' + e.message + (e.status === 409 ? ' (файл изменился — обнови страницу)' : ''), 'err');
      loadPosts().then(renderList).catch(function(){});
    }).then(function(){ setBusy(false); });
  }

  function removePost(i){
    if(busy) return;
    if(!confirm('Удалить пост «' + (posts[i].title || posts[i].date) + '»?')) return;
    var removed = posts.splice(i, 1)[0];
    setBusy(true); status('Удаляю…');
    commitPosts('Delete post: ' + (removed.title || removed.date)).then(function(){
      renderList();
      if(editIndex === i) resetForm();
      status('Удалено. Сайт обновится через 1–2 минуты.', 'ok');
    }).catch(function(e){
      status('Ошибка: ' + e.message, 'err');
      return loadPosts().then(renderList);
    }).catch(function(){}).then(function(){ setBusy(false); });
  }

  function connect(){
    var c = cfg();
    if(!c.owner || !c.repo || !c.token){ status('Заполни владельца, репозиторий и токен', 'err'); $('app').classList.remove('hidden'); return; }
    saveCfg(); setBusy(true);
    loadPosts().then(function(){
      $('app').classList.remove('hidden');
      $('settingsBox').classList.add('hidden');
      renderList(); resetForm(); status('');
    }).catch(function(e){
      $('settingsBox').classList.remove('hidden');
      alert('Не удалось подключиться: ' + e.message);
    }).then(function(){ setBusy(false); });
  }

  function logout(){
    try{ localStorage.removeItem('adminCfg'); }catch(e){}
    location.reload();
  }

  $('imageFile').addEventListener('change', function(){
    var f = this.files[0];
    if(f){ $('preview').src = URL.createObjectURL(f); $('preview').style.display = 'block'; }
  });
  $('connectBtn').onclick = connect;
  $('logoutBtn').onclick = logout;
  $('saveBtn').onclick = savePost;
  $('cancelBtn').onclick = function(){ resetForm(); status(''); };

  loadCfg();
  if(cfg().token && cfg().owner && cfg().repo) connect();
})();
</script>
</body>
</html>
